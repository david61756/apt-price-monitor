# 관심 단지 설정 — 대시보드 '단지 관리' 탭에서 생성됨
# region: 시군구명(자동 변환) / lawd_cd: 법정동코드 5자리 직접 지정
# match: 단지명 부분일치 키워드 / areas: 전용면적 ㎡ 정수 대역(생략 시 전체)
# targets: (선택) {전용면적: 목표가(만원)} — 매매 호가가 목표 이하로 내려오면 🎯 알림·강조
# watch:   (선택) [매물번호,...] — 특정 매물(article_no)을 📌 개별 추적·알림
#          매물번호는 대시보드 호가 목록에서 매물을 펼치면 표시됨

complexes:
  - name: "시흥목감 리벤티움 24평"
    region: "경기도 시흥시"
    match: ["리벤티움"]
    areas: [59]
    naver_id: "166117"
  - name: "성복역 현대홈타운 24, 30평"
    region: "경기도 용인시 수지구"
    match: ["서원마을현대홈타운"]
    areas: [59, 84]
    naver_id: "8692"
  - name: "진산마을성원상떼빌 32, 48평"
    region: "경기도 용인시 수지구"
    match: ["진산마을성원상떼빌"]
    areas: [84, 133]         # 전용 84.96(32평) / 133.44(48평)
    naver_id: "2221"
  - name: "서원마을3단지아이파크 33, 38평"
    region: "경기도 용인시 수지구"
    match: ["서원마을3단지아이파크"]
    areas: [84, 127]
    naver_id: "8425"
  - name: "e편한세상광교 39, 41평"
    region: "경기도 수원시 영통구"
    match: ["=광교e편한세상"]   # '광교2차e편한세상'(442세대) 오매칭 방지 정확일치
    areas: [100, 101]        # 전용 100.1~100.9(39평·308세대) / 101.2~101.9(41평·450세대)
    naver_id: "102091"       # 이의동 센트럴타운로 76 · 1,970세대 · 2012.12 · 주차 1.80

options:
  months_back: 1
  notify_cancellations: true

naver:
  trade_types: ["A1", "B1"]   # A1=매매, B1=전세(전세가율·기존주택 전세시세 추적용)
  notify: true

